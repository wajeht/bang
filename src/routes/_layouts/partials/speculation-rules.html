<script>
	if (HTMLScriptElement.supports && HTMLScriptElement.supports("speculationrules")) {
		const specScript = document.createElement("script");
		specScript.type = "speculationrules";

		// AGGRESSIVE SPECULATION RULES - Maximum Speed Configuration
		const specRules = {
			// === PRERENDER RULES ===
			// Prerender core app pages - instant navigation
			"prerender": [
				{
					"urls": [
						"/actions",
						"/bookmarks",
						"/notes",
						"/tabs",
						"/reminders",
						"/settings",
						"/settings/account",
						"/settings/data",
						"/about",
						"/bangs",
						"/privacy-policy",
						"/terms-of-service"
					],
					"eagerness": "eager"
				}
			],

			// === PREFETCH RULES ===
			// Prefetch on hover - covers dynamic URLs and detail pages
			"prefetch": [
				{
					// Detail pages with IDs
					"where": {
						"or": [
							{ "href_matches": "/actions/*/edit" },
							{ "href_matches": "/bookmarks/*/edit" },
							{ "href_matches": "/notes/*" },
							{ "href_matches": "/tabs/*/edit" },
							{ "href_matches": "/tabs/*/items/*" },
							{ "href_matches": "/reminders/*/edit" }
						]
					},
					"eagerness": "eager"
				},
				{
					// Create pages
					"urls": [
						"/actions/create",
						"/bookmarks/create",
						"/notes/create",
						"/tabs/create",
						"/reminders/create"
					],
					"eagerness": "eager"
				}
			]
		};

		specScript.textContent = JSON.stringify(specRules);
		document.head.appendChild(specScript);
	}
</script>
